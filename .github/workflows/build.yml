name: Build ELF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependencias
        run: apk add --no-cache build-base git

      - uses: actions/checkout@v4

      - name: Compilar
        run: make clean && make

      - name: Publicar ELF
        uses: actions/upload-artifact@v4
        with:
          name: SaveManagerReis-ELF
          path: SaveManagerReis.elf
